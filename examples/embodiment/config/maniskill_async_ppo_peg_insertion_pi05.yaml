# Async PPO (decoupled_actor_critic) on the peg-insertion pi0.5 wrist SFT ckpt,
# with dense per-chunk progress reward from a robometer eval server.
#
# Reward: history_buffer mode accumulates the scene's render_camera frames (one
# per chunk) and, at trajectory done, the reward worker (RobometerHistoryRewardModel,
# registered as model_type "robometer") POSTs them to the robometer server
# (http://127.0.0.1:8000), parses the per-frame progress curve p[t] in [0,1], and
# returns reward[chunk_i] = p[i] (success) / p[i]-1 (fail). env_reward_weight=0
# drops the ManiSkill reward; reward_weight=1 uses robometer. The actor LR (1e-6)
# is below the SFT peak (3e-6); value_lr is the separate random-init critic head.
#
# Launch (see run_train/peginsertion_maniskill_pi0.5/run_peg_insertion_rl_async.sh):
# pick the 3 least-full GPUs for the Ray cluster + 1 dedicated GPU for the
# robometer server (outside Ray). component_placement below assumes 3 logical
# GPUs (0-2); CUDA_VISIBLE_DEVICES remaps the chosen physical GPUs to 0,1,2.

defaults:
  - env/maniskill_peg_insertion_vertical_rl@env.train
  - env/maniskill_peg_insertion_vertical_rl@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run: {dir: .}
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout,reward: 0-2     # 3 logical GPUs (CUDA_VISIBLE_DEVICES remap)

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "peg_insertion_async_ppo_pi05_robometer"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  behave_weight_threshold: 2
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2
  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    rollout_epoch: 1
    total_num_envs: 12            # divisible by env_world_size (3 GPUs x stage 1 = 3)
    auto_reset: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 600
    max_steps_per_rollout_epoch: 600
    execute_action_chunks: 10
    temporal_ensemble_weight: 0.01
  eval:
    rollout_epoch: 1
    total_num_envs: 6
    auto_reset: True
    ignore_terminations: False
    max_episode_steps: 600
    max_steps_per_rollout_epoch: 600
    use_fixed_reset_state_ids: False
    group_size: ${algorithm.group_size}
    is_eval: True
    execute_action_chunks: 10
    temporal_ensemble_weight: 0.01
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10           # matches the working eval (fork handles the flat norm_stats)
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: "/data/yingxi/RLinf_RoboFAPE/logs/20260719-16:44:47-peg_insertion_sft_openpi_pi05_wrist-3200/checkpoints/global_step_40000/actor"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 240         # multiple of (3 GPUs x micro_batch_size 8 = 24)
  seed: 0
  enable_offload: False
  model:
    model_path: "/data/yingxi/RLinf_RoboFAPE/logs/20260719-16:44:47-peg_insertion_sft_openpi_pi05_wrist-3200/checkpoints/global_step_40000/actor"
    model_type: "openpi"
    add_value_head: True          # SFT ckpt had add_value_head=False -> cold-start value head
    num_action_chunks: 10
    num_steps: 4
    openpi:
      value_after_vlm: True
      config_name: "pi05_maniskill_peg_insertion_wrist"
      num_images_in_input: 2
      noise_method: "flow_noise"
      action_horizon: 10
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True         # True for flow_noise (PPO logprob)
    policy_setup: panda-ee-target-dpose
  optim:
    lr: 1.0e-6                    # < SFT peak 3e-6 (user requirement)
    value_lr: 1.55e-4             # random-init value head (standard PPO critic lr >> actor)
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 100      # actor loss zeroed during warmup (losses.py); value learns first
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"   # shard the ~4B model+optim across the RL GPUs (shared xulab GPUs have limited free mem)
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: True
  reward_mode: history_buffer
  history_reward_assign: True
  env_reward_weight: 0.0          # drop ManiSkill reward; robometer progress only
  reward_weight: 1.0
  group_name: "RewardGroup"
  model:
    model_type: robometer
    server_url: "http://127.0.0.1:8000"
    task: "Insert the peg vertically into the target hole."
    timeout_s: 120.0
    use_frame_steps: False        # full sequence per POST (no 4-frame prefix expansion);
    max_robometer_frames: 60      # uniform down-sample the full pick-up+insert buffer to <= this many frames per POST
    success_threshold: 0.5
    fail_shift: 1.0
    min_history_size: 2
    render_buffer_name: "render_buffer"
    history_buffers:
      render_buffer:
        history_keys: [render_images]
        history_size: 120         # >= max pickup (30) + max insert chunks (600 / num_action_chunks 10) + headroom;
                                  #   bumped from 60 so prepended pick-up frames stay in the robometer window.
        min_history_size: 2
        input_interval: 1
        input_on_done: True

critic:
  use_critic_model: False
