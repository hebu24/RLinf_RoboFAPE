# Async PPO on the peg-insertion pi0.5 wrist SFT ckpt, using Robometer progress
# DIRECTLY as the GAE value V(s_chunk) -- no learned critic.
#
# Oracle-value shaping (reward.shaping: oracle_value): the reward worker POSTs
# chunk-boundary frames to the robometer server (same as delta mode, total_chunks+1
# frames) and the per-boundary progress p[i] in [0,1] becomes the GAE value:
#   V[i] = p[i]            (successful episode)
#   V[i] = p[i] - fail_shift (failed episode)        # per-episode constant shift
# The reward carries ONLY terminal bonuses (success_bonus on success,
# failure_terminal_penalty on failure); non-terminal chunk reward = 0. The GAE
# advantage is then the TD delta:
#   delta_i = gamma * V[i+1] - V[i]   ~= gamma * p[i+1] - p[i]   (non-terminal)
# i.e. the chunk progress increment -- dense, low-variance, and equivalent to
# potential-based reward shaping (Ng 1999, Phi=progress), policy-invariant.
#
# Why: the learned value head is useless on this task (rbm4b run
# critic/explained_variance ~= 0.004-0.23, value_loss stuck 0.2-0.55, zero
# successes) -- robometer progress is the only real signal, so use it as the
# value instead of training a worse-than-mean critic.
#
# Knobs vs delta config:
#   reward.shaping: oracle_value
#   reward.oracle_value: {success_bonus, failure_terminal_penalty}
#   algorithm.loss_type: actor          # actor-only, NO critic loss (losses.py:564)
#   algorithm.use_oracle_value: True    # skip value-head forward in training
#   algorithm.normalize_returns: False  # no critic; returns are diagnostic only
#   add_value_head kept True for checkpoint weight compatibility (the head is
#   never forwarded during training; rollout still forwards it but env_worker
#   overwrites prev_values with the oracle progress per chunk).
#
# QUICK FALLBACK (lower-variance-rollback, no oracle injection): run the existing
# maniskill_async_ppo_peg_insertion_pi05_delta.yaml with overrides
#   algorithm.critic_free=True algorithm.loss_type=actor
# This uses delta rewards + GAE critic_free (values=None, A=remaining progress,
# REINFORCE, higher variance) and needs none of the oracle_value wiring. Use it
# to validate "progress as signal, no critic" cheaply before trusting the
# lower-variance oracle-value mode end-to-end.
#
# Launch (see run_train/peginsertion_maniskill_pi0.5/run_peg_insertion_rl_async.sh):
# use 2 RL GPUs per run and keep the Robometer server outside the Ray cluster.
# component_placement below assumes 2 logical GPUs (0-1);
# CUDA_VISIBLE_DEVICES remaps the chosen physical GPUs to 0,1.

defaults:
  - env/maniskill_peg_insertion_vertical_rl@env.train
  - env/maniskill_peg_insertion_vertical_rl@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run: {dir: .}
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout,reward: 0-1     # 2 logical GPUs (CUDA_VISIBLE_DEVICES remap)

runner:
  task_type: embodied
  stop_on_first_ev_nan: false
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "peg_insertion_async_ppo_pi05_robometer"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10
  save_interval: 10
  checkpoint_permanent_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True        # MUST: oracle advantage is ~0.01-0.05/chunk; without normalization PPO clip is too large
  normalize_returns: False          # no critic -> returns are diagnostic only (progress scale)
  kl_penalty_type: low_var_kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  readiness_min_fresh_chunks: 1
  staleness_filter_mode: chunk_mask
  actor_channel_keyed_routing: true
  rollout_store_size_per_rank: 2
  rollout_store_wait_timeout_s: 600
  rollout_store_status_interval_s: 30
  behave_weight_threshold: 2
  reward_type: chunk_level
  chunk_reward_aggregation: discounted_sum
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae                     # GAE else-branch (advantages.py:61) consumes the injected oracle values
  loss_type: decoupled_actor_critic  # entry-point runner/worker selection; use_oracle_value dispatches to actor-only loss inside the worker
  use_oracle_value: True            # skip value-head forward + dispatch to actor-only loss (no critic)
  loss_agg_func: "token-mean"
  kl_beta: 0.05
  entropy_bonus: 0.0
  clip_ratio_high: 0.1
  clip_ratio_low: 0.1
  clip_ratio_c: 3.0
  value_clip: 0.2                   # unused (no critic); kept for compat
  huber_delta: 10.0                 # unused (no critic); kept for compat
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    rollout_epoch: 1
    total_num_envs: 8             # divisible by env_world_size (2 GPUs x stage 1 = 2)
    auto_reset: True
    use_fixed_reset_state_ids: True
    shared_reset_seed: True
    max_episode_steps: 600
    max_steps_per_rollout_epoch: 600
    execute_action_chunks: 8
    temporal_ensemble_weight: 0.01
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: False
    max_episode_steps: 600
    max_steps_per_rollout_epoch: 600
    use_fixed_reset_state_ids: True
    shared_reset_seed: True
    group_size: ${algorithm.group_size}
    is_eval: True
    execute_action_chunks: 8
    temporal_ensemble_weight: 0.01
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  collect_prev_infos: True          # populate prev_values so env_worker can overwrite with oracle progress
  model:
    model_path: "/data/yingxi/RLinf_RoboFAPE/logs/20260719-16:44:47-peg_insertion_sft_openpi_pi05_wrist-3200/checkpoints/global_step_40000/actor"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 960
  grad_diagnostics_interval: 0
  seed: 0
  enable_offload: False
  model:
    model_path: "/data/yingxi/RLinf_RoboFAPE/logs/20260719-16:44:47-peg_insertion_sft_openpi_pi05_wrist-3200/checkpoints/global_step_40000/actor"
    model_type: "openpi"
    add_value_head: True            # kept for checkpoint weight compat; NOT forwarded during training (use_oracle_value)
    num_action_chunks: 10
    num_steps: 5
    openpi:
      detach_critic_input: True     # harmless; no critic grad flows (loss_type=actor)
      value_after_vlm: True
      config_name: "pi05_maniskill_peg_insertion_wrist"
      num_images_in_input: 2
      noise_method: "flow_sde"
      action_horizon: 10
      noise_params: [0.7, 0.3, 400]
      joint_logprob: False
    policy_setup: panda-ee-target-dpose
  optim:
    lr: 3.0e-7
    value_lr: 5.0e-5               # unused (no critic); kept for compat
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 0         # no critic to warm up
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: True
  debug_chunk_funnel: false
  fail_fast_on_unexpected_chunk_filter: false
  reward_mode: history_buffer
  history_train_mode: rollout_window
  history_reward_assign: True
  env_reward_weight: 0.0          # drop ManiSkill reward; robometer progress only
  reward_weight: 1.0
  group_name: "RewardGroup"
  shaping: oracle_value            # progress as V(s_chunk); terminal-only reward
  oracle_value:
    success_bonus: 1.0             # terminal reward on a successful episode's last chunk
    failure_terminal_penalty: -0.4  # terminal reward on a failed episode's last chunk
  model:
    model_type: robometer
    server_url: "http://127.0.0.1:8000"
    task: "Insert the peg vertically into the target hole."
    timeout_s: 120.0
    use_frame_steps: False
    max_robometer_frames: 60
    success_threshold: 0.5         # legacy/ignored; success comes from env infos
    fail_shift: 1.0                # per-episode V shift on failure (V -= fail_shift)
    min_history_size: 2
    render_buffer_name: "render_buffer"
    history_buffers:
      render_buffer:
        history_keys: [render_images]
        history_size: 720
        min_history_size: 2
        input_interval: 1
        input_on_done: True

critic:
  use_critic_model: False
