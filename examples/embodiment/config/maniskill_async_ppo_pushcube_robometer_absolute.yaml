# Async PPO on PushCube-v1 with Robometer absolute progress reward.
# RL uses 2 GPUs via CUDA_VISIBLE_DEVICES in the launcher; Robometer server runs
# as a separate process on its own GPU. PushCube is trained as the full task from
# normal reset; insertion-only/pre-grasped reset is reserved for peg insertion.

defaults:
  - env/maniskill_pushcube_robometer_rl@env.train
  - env/maniskill_pushcube_robometer_rl@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run: {dir: .}
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout,reward: 0-1

runner:
  task_type: embodied
  stop_on_first_ev_nan: false
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "pushcube_async_ppo_pi05_robometer_absolute"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10
  save_interval: 10
  checkpoint_permanent_interval: 50
  save_critic_warmup_checkpoint: true
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  normalize_returns: True
  kl_penalty_type: low_var_kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  readiness_min_fresh_chunks: 1
  staleness_filter_mode: chunk_mask
  actor_channel_keyed_routing: true
  rollout_store_wait_timeout_s: 600
  rollout_store_status_interval_s: 30
  behave_weight_threshold: 2
  reward_type: chunk_level
  chunk_reward_aggregation: discounted_sum
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.05
  entropy_bonus: 0.0
  clip_ratio_high: 0.1
  clip_ratio_low: 0.1
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    rollout_epoch: 1
    total_num_envs: 32
    auto_reset: True
    use_fixed_reset_state_ids: False
    shared_reset_seed: False
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    execute_action_chunks: 10
    temporal_ensemble_weight: 0.01
  eval:
    rollout_epoch: 1
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    use_fixed_reset_state_ids: False
    shared_reset_seed: False
    group_size: ${algorithm.group_size}
    is_eval: True
    execute_action_chunks: 5
    temporal_ensemble_weight: 0.01
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
      max_videos: 5

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: maniskill
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:MODEL_PATH,/data/yingxi/RLinf_RoboFAPE/logs/pushcube_sft_wrist_filtered_conservative_20260823/train_40k_fresh_0_3/pushcube_sft_wrist_filtered_conservative_40k_fresh_0_3/checkpoints/global_step_35000/actor}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 640
  grad_diagnostics_interval: 0
  seed: 0
  enable_offload: False
  model:
    model_path: ${oc.env:MODEL_PATH,/data/yingxi/RLinf_RoboFAPE/logs/pushcube_sft_wrist_filtered_conservative_20260823/train_40k_fresh_0_3/pushcube_sft_wrist_filtered_conservative_40k_fresh_0_3/checkpoints/global_step_35000/actor}
    model_type: "openpi"
    add_value_head: True
    num_action_chunks: 10
    action_dim: 8
    use_proprio: true
    num_steps: 5
    openpi:
      detach_critic_input: True
      value_after_vlm: True
      config_name: "pi05_maniskill_wrist"
      num_images_in_input: 2
      action_horizon: 10
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      train_expert_only: True
      mask_gripper_loss: True
      noise_method: "flow_sde"
      noise_params: [0.7, 0.3, 400]
      joint_logprob: False
    policy_setup: panda
  optim:
    lr: 3.0e-7
    value_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 15
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: True
  debug_chunk_funnel: false
  fail_fast_on_unexpected_chunk_filter: false
  reward_mode: history_buffer
  history_train_mode: rollout_window
  history_reward_assign: True
  env_reward_weight: 0.0
  reward_weight: 1.0
  group_name: "RewardGroup"
  shaping: absolute
  absolute:
    success_terminal_bonus: 0.0
  model:
    model_type: robometer
    server_url: "http://127.0.0.1:8001"
    task: "Push the cube across the tabletop until its center lies inside the target region."
    timeout_s: 120.0
    use_frame_steps: False
    max_robometer_frames: 30
    success_threshold: 0.5
    fail_shift: 1.0
    min_history_size: 2
    render_buffer_name: "render_buffer"
    history_buffers:
      render_buffer:
        history_keys: [render_images]
        history_size: 220
        min_history_size: 2
        input_interval: 1
        input_on_done: True

critic:
  use_critic_model: False
