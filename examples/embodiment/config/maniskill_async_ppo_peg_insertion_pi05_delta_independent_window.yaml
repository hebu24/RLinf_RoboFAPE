# Async PPO (decoupled_actor_critic) on the peg-insertion pi0.5 wrist SFT ckpt,
# with Robometer progress first reconstructed on low-level env steps and then
# aggregated back into chunk rewards for PPO — INDEPENDENT ROLLOUT WINDOW mode.
#
# This config mirrors maniskill_async_ppo_peg_insertion_pi05_delta.yaml except
# env.train.rollout_window_mode=independent (see
# ASYNC_INDEPENDENT_ROLLOUT_WINDOW_IMPLEMENTATION.md). Each training rollout
# window is a self-contained unit: at the window boundary every unfinished
# episode is force-closed as a synthetic *truncation* (never a task termination),
# Robometer rewards are settled up to the boundary, then all train envs are
# reset + history cleared so the next window starts from a fresh reset obs.
# Cross-window resume via last_obs_list is disabled; prefetch_train_bootstrap is
# disabled in this mode. Requires auto_reset=true, reward.history_train_mode=
# rollout_window, rollout_epoch=1 (env_worker validates these).
#
# Reward: history_buffer mode accumulates the scene's render_camera frames at
# every low-level env step. At trajectory done, the reward worker
# (RobometerHistoryRewardModel, registered as model_type "robometer") POSTs a
# uniformly downsampled pick-up+insertion video to the robometer server
# (http://127.0.0.1:8000), parses the per-frame progress curve p[t] in [0,1],
# resolves success strictly from env-side success_once/success fields, converts
# it to low-level reward (`p[t]` on success, `p[t]-1` on failure), linearly
# interpolates that curve over insertion env steps, and chunk-level PPO later
# aggregates each 10-step chunk with discounted_sum using algorithm.gamma.
# env_reward_weight=0 drops the ManiSkill reward; reward_weight=1 uses
# Robometer. The actor LR (1e-6) is below the SFT peak (3e-6); value_lr is the
# separate random-init critic head.
#
# Launch (see run_train/peginsertion_maniskill_pi0.5/run_peg_insertion_rl_async.sh):
# use 2 RL GPUs per run and keep the Robometer server outside the Ray cluster.
# component_placement below assumes 2 logical GPUs (0-1);
# CUDA_VISIBLE_DEVICES remaps the chosen physical GPUs to 0,1.
# Keep the log/experiment dir names containing "independent_window" to avoid
# confusing these runs with legacy continuous-window experiments.

defaults:
  - env/maniskill_peg_insertion_vertical_rl@env.train
  - env/maniskill_peg_insertion_vertical_rl@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run: {dir: .}
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout,reward: 0-1     # 2 logical GPUs (CUDA_VISIBLE_DEVICES remap)

runner:
  task_type: embodied
  stop_on_first_ev_nan: false
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "peg_insertion_async_ppo_pi05_robometer_independent_window"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10
  save_interval: 10
  checkpoint_permanent_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  normalize_returns: True     # wire to GAE (advantages.py:83) via async_ppo_fsdp_worker kwargs; returns -> O(1), value_loss O(1), un-dominate clip_grad_norm so actor policy grad isn't starved
  # Frozen SFT reference policy constraint. low_var_kl is non-negative per
  # sample, unlike the high-variance sampled k1 estimator.
  kl_penalty_type: low_var_kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  readiness_min_fresh_chunks: 1
  # --- async-PPO completed-episode staleness fix (ASYNC_STALENESS_FIX_PLAN.md) ---
  # chunk_mask: keep the WHOLE completed episode for GAE + Robometer reward
  # reconstruction, only mask stale CHUNKS out of loss/reward aggregation (do
  # NOT drop the trajectory by versions.min()). The actor readiness loop uses a
  # two-phase all_reduce(MIN) collective (peek/take/discard_topn) so every rank
  # has a fresh chunk before take_topn. Default "trajectory" keeps legacy behavior.
  staleness_filter_mode: chunk_mask
  # Keyed routing: each env worker shards completed episodes to a per-actor-rank
  # dedicated channel key (CommMapper.get_dst_ranks/build_channel_key), so no two
  # actor ranks contend for one shared queue. Generic M:N, not 4-card-specific.
  actor_channel_keyed_routing: true
  # Each actor rank receives 4 completed episodes per trajectory. Taking two
  # trajectories per rank gives 16 episodes across the 2-rank actor group.
  rollout_store_size_per_rank: 2
  # Readiness collective timeout + periodic status log interval (seconds).
  rollout_store_wait_timeout_s: 600
  rollout_store_status_interval_s: 30
  behave_weight_threshold: 2
  reward_type: chunk_level
  chunk_reward_aggregation: discounted_sum
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.05
  entropy_bonus: 0.0
  clip_ratio_high: 0.1
  clip_ratio_low: 0.1
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    rollout_epoch: 1
    total_num_envs: 8             # divisible by env_world_size (2 GPUs x stage 1 = 2)
    auto_reset: True
    rollout_window_mode: independent  # force-close unfinished episodes + reset all envs/clear history at each window boundary
    use_fixed_reset_state_ids: True
    shared_reset_seed: True       # reproduce one SFT reset across every env/reset
    max_episode_steps: 600
    max_steps_per_rollout_epoch: 600
    execute_action_chunks: 8
    temporal_ensemble_weight: 0.01
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: False
    max_episode_steps: 600
    max_steps_per_rollout_epoch: 600
    use_fixed_reset_state_ids: True
    shared_reset_seed: True
    group_size: ${algorithm.group_size}
    is_eval: True
    execute_action_chunks: 8
    temporal_ensemble_weight: 0.01
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10           # matches the working eval (fork handles the flat norm_stats)
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: "/data/yingxi/RLinf_RoboFAPE/logs/20260719-16:44:47-peg_insertion_sft_openpi_pi05_wrist-3200/checkpoints/global_step_40000/actor"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 960         # one optimizer step over all 16 episodes (60 chunks each)
  # Disabled: sampled diagnostics require repeated backward calls on one FSDP
  # graph, which can invalidate FSDP flat-parameter storage. PPO update
  # diagnostics below remain available without extra backward calls.
  grad_diagnostics_interval: 0
  seed: 0
  enable_offload: False
  model:
    model_path: "/data/yingxi/RLinf_RoboFAPE/logs/20260719-16:44:47-peg_insertion_sft_openpi_pi05_wrist-3200/checkpoints/global_step_40000/actor"
    model_type: "openpi"
    add_value_head: True          # SFT ckpt had add_value_head=False -> cold-start value head
    num_action_chunks: 10
    num_steps: 5                 # match the SFT evaluation sampler
    openpi:
      detach_critic_input: True    # train value head without critic gradients entering the policy backbone
      value_after_vlm: True
      config_name: "pi05_maniskill_peg_insertion_wrist"
      num_images_in_input: 2
      noise_method: "flow_sde"  # match the SFT evaluation sampler
      action_horizon: 10
      noise_params: [0.7, 0.3, 400]  # SFT flow-SDE sampler defaults
      joint_logprob: False        # flow-SDE uses the single denoise-step logprob
    policy_setup: panda-ee-target-dpose
  optim:
    lr: 3.0e-7                    # conservative PPO update for the pretrained policy
    value_lr: 5.0e-5              # limit critic gradients in the shared grad clip
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 50        # one optimizer step/version: preserve ~50-version warmup
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"   # shard the ~4B model+optim across the RL GPUs (shared xulab GPUs have limited free mem)
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: True
  debug_chunk_funnel: false
  fail_fast_on_unexpected_chunk_filter: false
  reward_mode: history_buffer
  history_train_mode: rollout_window  # keep full Robometer history for reward reconstruction, but train on the current rollout window; MUST NOT be complete_episode in independent mode
  history_reward_assign: True
  env_reward_weight: 0.0          # drop ManiSkill reward; robometer progress only
  reward_weight: 1.0
  group_name: "RewardGroup"
  shaping: delta                  # per-chunk progress delta plus an env-success bonus
  delta:
    success_bonus: 1.0            # make true task success dominate Robometer delta noise
    failure_terminal_penalty: -0.4  # applied once to the final chunk of an unsuccessful episode (incl. synthetic timeouts)
  model:
    model_type: robometer
    server_url: "http://127.0.0.1:8000"
    task: "Insert the peg vertically into the target hole."
    timeout_s: 120.0
    use_frame_steps: False        # full sequence per POST (no 4-frame prefix expansion);
    max_robometer_frames: 60      # uniform down-sample the full pick-up+insert buffer to <= this many frames per POST
    success_threshold: 0.5      # legacy/ignored for peg-insertion RL; success must come from env infos
    fail_shift: 1.0
    min_history_size: 2
    render_buffer_name: "render_buffer"
    history_buffers:
      render_buffer:
        history_keys: [render_images]
        history_size: 720         # Keep the full low-level pick-up+insert window for a 600-step episode.
                                  # 600 insert steps + ~30 pick-up prefix is the practical minimum; use extra
                                  # headroom so trimming never drops early insertion context before Robometer query.
        min_history_size: 2
        input_interval: 1
        input_on_done: True

critic:
  use_critic_model: False
