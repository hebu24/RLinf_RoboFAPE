defaults:
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.env:SFT_COMPONENT_PLACEMENT,0-3}

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "stackcube_sft_wrist"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 40000
  val_check_interval: -1
  save_interval: 5000

  resume_dir: null
  ckpt_path: null

data:
  train_data_paths: "/data/yingxi/datasets/robofpe_sft/StackCube-v1_render_wrist_filtered_q99/lerobot"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 64
  seed: 0

  model:
    precision: null
    model_path: "/data/yingxi/weights/pi05_base"
    model_type: "openpi"
    num_action_chunks: 10
    action_dim: 8
    add_value_head: False
    openpi:
      config_name: "pi05_maniskill_wrist"
      # Conversion stores human render_camera pixels in the historical top field.
      # the model still consumes exactly two image views.
      num_images_in_input: 2
      train_expert_only: True
      mask_gripper_loss: False
      detach_critic_input: True

  optim:
    lr: 3e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 40000
    lr_warmup_steps: 500
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-7

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
